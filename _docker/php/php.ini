; Основные настройки
memory_limit = 256M
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 300
max_input_time = 300
max_input_vars = 10000

; Безопасность
cgi.fix_pathinfo = 0
expose_php = Off
disable_functions = exec,passthru,shell_exec,system,popen
disable_classes = 
allow_url_fopen = Off

; Сессии
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
session.cookie_samesite = Lax

; Логирование
log_errors = On
error_log = /var/log/php/error.log

; OpCache (производительность)
opcache.enable=0
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
opcache.revalidate_freq=0           ; Проверять при каждом запросе
opcache.validate_timestamps=1       ; Проверять временные метки
opcache.max_file_size=0
opcache.fast_shutdown=1

; Для разработки
display_errors = On
display_startup_errors = On
error_reporting = E_ALL

; Для продакшена закомментируйте:
display_errors = Off
display_startup_errors = Off
opcache.validate_timestamps = 0